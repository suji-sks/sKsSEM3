    }
    function calculatePercentage(total)
    {
        return total/5;
    }
    function calculateGrade(Percentage)
    {
        if (percentage >= 90)
        return "A+";
    else if (percentage >= 80)
        return "A";
    else if (percentage >= 70)
        return "B";

        return "C";

    }
