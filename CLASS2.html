<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <script>
        function calculate() {
            const a = Number(document.getElementById('number1').value);
            const b = Number(document.getElementById('number2').value);
            const operator = document.getElementById('operator').value;
            const resultEl = document.getElementById('result');

            let res;
            switch (operator) {
                case '+':
                    res = a + b;
                    break;
                case '-':
                    res = a - b;
                    break;
                case '*':
                    res = a * b;
                    break;
                case '/':
                    res = b === 0 ? 'Cannot divide by zero' : a / b;
                    break;
                default:
                    res = 'Unknown operation';
            }

            resultEl.textContent = `Result: ${res}`;
        }
    </script>
</head>
<body>  
    <div class="calculator">
        <h1>Calculator</h1>

        <label for="number1">First number</label>
        <input type="number" id="number1" placeholder="Enter first number">
        <p>
        <label for="number2">Second number</label>
        <input type="number" id="number2" placeholder="Enter second number">
        </p>
        <label for="operator">Operation</label>
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
        </select>
         <p>
        <button type="button" onclick="calculate()">Calculate</button>
        </p>

        <div id="result">Result will appear here.</div>
    </div>
</body>
</html>
